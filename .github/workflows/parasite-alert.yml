name: parasite-alert
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay runs a bit)
  workflow_dispatch:          # lets you run it manually from the Actions tab
permissions:
  contents: write             # needed to save last_height.txt
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Parasite blocks
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python parasite_alert.py
      - name: Save state
        run: |
          git config user.name "parasite-alert"
          git config user.email "actions@users.noreply.github.com"
          git add last_height.txt
          git diff --cached --quiet || (git commit -m "update last height" && git push)
