name: parasite-alert
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Parasite blocks
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python parasite_alert.py
      - name: Save state
        run: |
          git config user.name "parasite-alert"
          git config user.email "actions@users.noreply.github.com"
          git add last_height.txt
          git diff --cached --quiet || (git commit -m "update last height" && git pull --rebase -X theirs origin main && git push)
